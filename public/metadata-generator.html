<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NextTrack Metadata Generator</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0f14;
        --surface: #151a21;
        --surface-2: #1d2430;
        --border: rgba(255, 255, 255, 0.1);
        --text: #f4efe6;
        --muted: #b4ad9e;
        --accent: #ffb83b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(180deg, #080a0f, #10141b);
        color: var(--text);
      }

      .page {
        width: min(1080px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
        display: grid;
        gap: 20px;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 22px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      .stack {
        display: grid;
        gap: 10px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }

      button {
        border: 0;
        border-radius: 14px;
        padding: 12px 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .primary {
        background: linear-gradient(180deg, #ffc85e, #f3a11f);
        color: #1d140a;
      }

      .secondary {
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--border);
      }

      .muted {
        color: var(--muted);
      }

      .status {
        display: grid;
        gap: 8px;
        max-height: 260px;
        overflow: auto;
        font-size: 0.94rem;
      }

      .status-line {
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }

      .summary-card {
        padding: 16px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .summary-card strong {
        display: block;
        margin-bottom: 8px;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        color: #dcd6ca;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="panel stack">
        <h1>NextTrack Metadata Generator</h1>
        <p class="muted">
          This tool reads your songs, extracts basic tags, analyzes the audio locally, and writes
          <code>public/music/metadata.json</code>.
        </p>
        <div class="actions">
          <button id="analyze-button" class="primary" type="button">Analyze library</button>
          <button id="download-button" class="secondary" type="button" disabled>Download JSON preview</button>
          <span id="result-copy" class="muted">Waiting to start.</span>
        </div>
      </section>

      <section class="panel stack">
        <h2>Run log</h2>
        <div id="status-log" class="status"></div>
      </section>

      <section class="panel stack">
        <h2>Summary</h2>
        <div id="summary" class="summary-grid"></div>
      </section>

      <section class="panel stack">
        <h2>Preview</h2>
        <pre id="preview">{}</pre>
      </section>
    </main>

    <script type="module" src="/metadata-generator.js"></script>
  </body>
</html>
